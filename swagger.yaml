openapi: 3.0.0

info:
  title: LCA Service API
  version: 1.0.0
  description: AI, Secrets, and Company DPP APIs

servers:
  - url: http://localhost:5000
    description: Local

components:
  securitySchemes:
    # ApiKeyAuth:
    #   type: apiKey
    #   in: header
    #   name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object

paths:
  /api/v1/ai/generate:
    post:
      tags:
        - AI
      summary: Generate AI response
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        type: string
                  description: Chat messages array
                modelName:
                  type: string
                  description: Preferred selector across companies (e.g., gpt-4o-mini, gpt-4o)
              required:
                - messages
      responses:
        '200':
          description: AI response generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized - missing or invalid API key or JWT token
        '404':
          description: No active LLM model configured for the company

  /api/v1/ai/comments:
    get:
      tags:
        - AI
      summary: Get AI comments for the authenticated user
      description: Returns active AI comments for the logged-in user, optionally filtered by draftHeaderId.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - in: query
          name: draftHeaderId
          required: false
          schema:
            type: integer
          description: Optional draft header ID to filter comments for the authenticated user.
      responses:
        '200':
          description: AI comments retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid draftHeaderId parameter
        '401':
          description: Unauthorized - missing or invalid API key or JWT token

  /api/v1/ai/comments/bulk:
    post:
      tags:
        - AI
      summary: Save AI comments in bulk
      description: Upserts AI summary comments for the authenticated user. Existing rows are updated; new rows are inserted.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comments:
                  type: array
                  items:
                    type: object
                    properties:
                      draftHeaderId:
                        type: integer
                      draftDetailId:
                        type: integer
                        nullable: true
                      commentType:
                        type: string
                        example: ASSESSMENT
                      commentText:
                        type: string
                      aiModelName:
                        type: string
                        example: gpt-4.1-mini
                    required:
                      - draftHeaderId
                      - commentText
      responses:
        '200':
          description: AI comments saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized - missing or invalid API key or JWT token

  /api/v1/secrets/system-secret/{secretName}:
    get:
      tags:
        - Secrets
      summary: Get active system secret by name
      description: Returns a single active secret value from gs_SystemSecret by SecretName
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: secretName
          required: true
          schema:
            type: string
          example: DEVEXTREME_LICENSE_KEY
      responses:
        '200':
          description: System secret retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Secret not found

  /api/v1/secrets/llm-models:
    get:
      tags:
        - Secrets
      summary: Get active LLM models for company
      description: Returns LLM models filtered by the authenticated user's company ID from JWT
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: Active LLM models for the company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized - missing or invalid API key or JWT token

  /api/v1/dpp/generate:
    post:
      tags:
        - Digital Passport
      summary: Generate a Digital Passport
      description: Generates a passport selected by the required passportType. Company, User, and Delegate identity are derived from JWT claims.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - in: query
          name: passportType
          required: true
          schema:
            type: string
            enum: [COMPANY, USER, DELEGATE, PRODUCT]
          description: Passport type. PRODUCT currently returns 501 until its template is implemented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Company DPP payload
                  type: object
                  required: [meta, company, emissions, activities, decarbonization, lcaConfig, assurance, certificates, about, sustainabilityMetrics, greenPractices, dataVerification, privacyPolicyUrl, poweredByLabel]
                  properties:
                    meta:
                      type: object
                      required: [companyName]
                      properties:
                        companyName: { type: string }
                        countryName: { type: string }
                        website: { type: string }
                        description: { type: string }
                    company: { type: object }
                    emissions: { type: object }
                    activities: { type: array, items: { type: object } }
                    decarbonization: { type: object }
                    lcaConfig: { type: object }
                    assurance: { type: object }
                    certificates: { type: array, items: { type: object } }
                    about: { type: object }
                    sustainabilityMetrics: { type: object }
                    greenPractices: { type: array, items: { type: object } }
                    dataVerification: { type: object }
                    privacyPolicyUrl: { type: string }
                    poweredByLabel: { type: string }
                - title: User DPP payload
                  type: object
                  required: [designation, workModel, reportingYear, businessTravelEmissions, dailyCommuteEmissions, accommodationEmissions, remoteWorkEmissions, homeElectricityEmissions, deviceEnergyEmissions, totalUserEmissions, activityCount, lastCalculationDate, verificationStatus]
                  properties:
                    designation: { type: string }
                    department: { type: string, nullable: true }
                    workModel: { type: string }
                    location: { type: string, nullable: true }
                    reportingYear: { type: string }
                    businessTravelEmissions: { type: number, minimum: 0 }
                    dailyCommuteEmissions: { type: number, minimum: 0 }
                    accommodationEmissions: { type: number, minimum: 0 }
                    remoteWorkEmissions: { type: number, minimum: 0 }
                    homeElectricityEmissions: { type: number, minimum: 0 }
                    deviceEnergyEmissions: { type: number, minimum: 0 }
                    totalUserEmissions: { type: number, minimum: 0 }
                    activityCount: { type: integer, minimum: 0 }
                    sustainabilityScore: { type: number, nullable: true, minimum: 0 }
                    lastCalculationDate: { type: string, format: date }
                    verificationStatus: { type: string }
                - title: Delegate DPP payload
                  type: object
                  required: [event, delegate, footprint]
                  properties:
                    event:
                      type: object
                      required: [name, year]
                      properties:
                        name: { type: string }
                        year: { oneOf: [{ type: string }, { type: number }] }
                        id: { type: string }
                        dates: { type: string }
                        venue: { type: string }
                        city: { type: string }
                        verified: { type: boolean }
                        myPassportUrl: { type: string, format: uri }
                        logoUrl: { type: string, format: uri }
                    delegate:
                      type: object
                      required: [jobTitle]
                      properties:
                        fullName: { type: string, description: Defaults to the JWT user name. }
                        jobTitle: { type: string }
                        company: { type: string, description: Defaults to the JWT company name. }
                        passType: { type: string }
                        photoUrl: { type: string, format: uri }
                        idNumber: { type: string }
                    qr:
                      type: object
                      properties:
                        imageUrl: { type: string, format: uri }
                        label: { type: string }
                        sublabel: { type: string }
                    agenda:
                      type: array
                      items:
                        type: object
                        required: [time, title, location]
                        properties:
                          time: { type: string }
                          title: { type: string }
                          location: { type: string }
                    footprint:
                      type: object
                      required: [total]
                      properties:
                        total: { type: number, minimum: 0 }
                        unit: { type: string }
                        offsetLabel: { type: string }
                        segments:
                          type: array
                          items:
                            type: object
                            required: [label, value, percent]
                            properties:
                              label: { type: string }
                              value: { oneOf: [{ type: string }, { type: number }] }
                              percent: { type: number, minimum: 0, maximum: 100 }
                    credentials:
                      type: array
                      items:
                        type: object
                        required: [title, subtitle]
                        properties:
                          title: { type: string }
                          subtitle: { type: string }
                          verified: { type: boolean }
                    verification:
                      type: object
                      properties:
                        credentialType: { type: string }
                        issuerDid: { type: string }
                        revocable: { type: boolean }
                        active: { type: boolean }
                        shareContactCard: { type: boolean }
                        sealImageUrl: { type: string, format: uri }
                    eventStats:
                      type: object
                      properties:
                        totalFootprint: { type: number }
                        unit: { type: string }
                        perDelegate: { type: number }
                        delegates: { type: number }
                        offsetPercent: { type: number }
                    eventBreakdown:
                      type: array
                      items:
                        type: object
                        properties: { label: { type: string }, percent: { type: number } }
                    eventTravelByMode:
                      type: array
                      items:
                        type: object
                        properties: { mode: { type: string }, percent: { type: number } }
                    eventSustainabilityActions:
                      type: array
                      items:
                        type: object
                        properties:
                          label: { type: string }
                          value: { oneOf: [{ type: string }, { type: number }] }
                    eventOffset:
                      type: object
                      properties:
                        residualEmissions: { type: number }
                        unit: { type: string }
                        offsetPurchased: { type: number }
                        offsetLabel: { type: string }
                        net: { oneOf: [{ type: string }, { type: number }] }
                        registry: { type: string }
                        projectId: { type: string }
                        vintage: { oneOf: [{ type: string }, { type: number }] }
                    eventCertifications:
                      type: array
                      items: { type: string }
                    branding:
                      type: object
                      properties:
                        primary: { type: string, example: '#0B2545' }
                        accent: { type: string, example: '#14B8A6' }
                    flags:
                      type: object
                      additionalProperties: { type: boolean }
      responses:
        '201':
          description: Digital Passport generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      passportGUID:
                        type: string
                      publicToken:
                        type: string
                      passportVersion:
                        type: integer
                      htmlFileName:
                        type: string
                      htmlFilePath:
                        type: string
                      publishedHTMLURL:
                        type: string
                      status:
                        type: string
                        enum: [DRAFT, REVIEWED, APPROVED, PUBLISHED]
                      physicalFilePath:
                        type: string
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized - invalid JWT claims
        '501':
          description: Requested passport type is not implemented

  /api/v1/dpp/meta:
    get:
      tags:
        - Digital Passport
      summary: Get Digital Passport metadata
      description: Returns all active passport metadata for the JWT company, including DRAFT, REVIEWED, APPROVED, and PUBLISHED passports. Supports filtering by required passportType and optional publicToken for a single row.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - in: query
          name: passportType
          required: true
          schema:
            type: string
            enum: [COMPANY, PRODUCT, USER, DELEGATE]
          description: Required passport type filter.
        - in: query
          name: publicToken
          required: false
          schema:
            type: string
          description: Optional public token. If omitted, returns all active rows, including drafts, for the JWT company.
      responses:
        '200':
          description: Company DPP metadata returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    oneOf:
                      - type: array
                        items:
                          type: object
                          properties:
                            companyDigitalPassportId:
                              type: integer
                            companyId:
                              type: integer
                            passportGuid:
                              type: string
                            passportType:
                              type: string
                              enum: [COMPANY, PRODUCT, USER, DELEGATE]
                            passportVersion:
                              type: integer
                            htmlFileName:
                              type: string
                            htmlFilePath:
                              type: string
                            publishedHtmlUrl:
                              type: string
                            isPublished:
                              type: boolean
                            publishedOn:
                              type: string
                              format: date-time
                            publicToken:
                              type: string
                            status:
                              type: string
                              enum: [DRAFT, REVIEWED, APPROVED, PUBLISHED]
                      - type: object
                        properties:
                          companyDigitalPassportId:
                            type: integer
                          companyId:
                            type: integer
                          passportGuid:
                            type: string
                          passportType:
                            type: string
                            enum: [COMPANY, PRODUCT, USER, DELEGATE]
                          passportVersion:
                            type: integer
                          htmlFileName:
                            type: string
                          htmlFilePath:
                            type: string
                          publishedHtmlUrl:
                            type: string
                          isPublished:
                            type: boolean
                          publishedOn:
                            type: string
                            format: date-time
                          publicToken:
                            type: string
                          status:
                            type: string
                            enum: [DRAFT, REVIEWED, APPROVED, PUBLISHED]
        '401':
          description: Unauthorized - missing or invalid API key or JWT token
        '400':
          description: Invalid passportType value
        '404':
          description: Digital Passport not found for provided token

  /api/v1/dpp/{companyDigitalPassportId}/status:
    patch:
      tags:
        - Digital Passport
      summary: Update Digital Passport status
      description: Updates a passport to DRAFT, REVIEWED, APPROVED, or PUBLISHED. APPROVED is an approval decision only. PUBLISHED sets IsPublished to true and makes the public HTML route available; all other states remain unpublished.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - in: path
          name: companyDigitalPassportId
          required: true
          schema:
            type: integer
          description: Digital Passport record ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [DRAFT, REVIEWED, APPROVED, PUBLISHED]
                  example: REVIEWED
      responses:
        '200':
          description: Digital Passport status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      companyDigitalPassportId:
                        type: integer
                      status:
                        type: string
                        enum: [DRAFT, REVIEWED, APPROVED, PUBLISHED]
                      isPublished:
                        type: boolean
        '400':
          description: Invalid DPP ID or status
        '401':
          description: Unauthorized - invalid JWT claims
        '404':
          description: Digital Passport not found

  /api/v1/dpp/preview/{publicToken}:
    get:
      tags:
        - Digital Passport
      summary: Preview a Digital Passport
      description: Returns the DPP HTML for the authenticated company, regardless of whether its status is DRAFT, REVIEWED, APPROVED, or PUBLISHED. This route is protected and is not public.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - in: path
          name: publicToken
          required: true
          schema:
            type: string
        - in: query
          name: passportType
          required: true
          schema:
            type: string
            enum: [COMPANY, PRODUCT, USER, DELEGATE]
      responses:
        '200':
          description: DPP preview HTML
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Unauthorized - missing or invalid API key or JWT token
        '404':
          description: Digital Passport not found for the authenticated company

  /dpp/{publicToken}:
    get:
      tags:
        - Digital Passport Public
      summary: Public Digital Passport HTML
      description: Public route that serves HTML only when the DPP status is PUBLISHED and IsPublished is true.
      parameters:
        - in: path
          name: publicToken
          required: true
          schema:
            type: string
        - in: query
          name: passportType
          required: true
          schema:
            type: string
            enum: [COMPANY, PRODUCT, USER, DELEGATE]
          description: Required passport type filter.
      responses:
        '200':
          description: HTML content
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Invalid passportType value
        '404':
          description: Digital Passport not found
