openapi: 3.0.0

info:
  title: LCA Service API
  version: 1.0.0
  description: AI and Secrets API only

servers:
  - url: http://localhost:5000
    description: Local

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object

paths:
  /api/v1/ai/generate:
    post:
      summary: Generate AI response
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        type: string
                  description: Chat messages array
                modelName:
                  type: string
                  description: Preferred selector across companies (e.g., gpt-4o-mini, gpt-4o)
              required:
                - messages
      responses:
        '200':
          description: AI response generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized - missing or invalid API key or JWT token
        '404':
          description: No active LLM model configured for the company

  /api/v1/ai/comments:
    get:
      summary: Get AI comments for the authenticated user
      description: Returns active AI comments for the logged-in user, optionally filtered by draftHeaderId.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - in: query
          name: draftHeaderId
          required: false
          schema:
            type: integer
          description: Optional draft header ID to filter comments for the authenticated user.
      responses:
        '200':
          description: AI comments retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid draftHeaderId parameter
        '401':
          description: Unauthorized - missing or invalid API key or JWT token

  /api/v1/ai/comments/bulk:
    post:
      summary: Save AI comments in bulk
      description: Upserts AI summary comments for the authenticated user. Existing rows are updated; new rows are inserted.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comments:
                  type: array
                  items:
                    type: object
                    properties:
                      draftHeaderId:
                        type: integer
                      draftDetailId:
                        type: integer
                        nullable: true
                      commentType:
                        type: string
                        example: ASSESSMENT
                      commentText:
                        type: string
                      aiModelName:
                        type: string
                        example: gpt-4.1-mini
                    required:
                      - draftHeaderId
                      - commentText
      responses:
        '200':
          description: AI comments saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized - missing or invalid API key or JWT token

  /api/v1/secrets/system-secret/{secretName}:
    get:
      summary: Get active system secret by name
      description: Returns a single active secret value from gs_SystemSecret by SecretName
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: secretName
          required: true
          schema:
            type: string
          example: DEVEXTREME_LICENSE_KEY
      responses:
        '200':
          description: System secret retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Secret not found

  /api/v1/secrets/llm-models:
    get:
      summary: Get active LLM models for company
      description: Returns LLM models filtered by the authenticated user's company ID from JWT
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: Active LLM models for the company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized - missing or invalid API key or JWT token
